name: Teras

options:
  bundleIdPrefix: app.teras
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  TerasProtocol:
    path: ../Shared/TerasProtocol

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: RP5GZ99V95
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/Display/include
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:

  TerasCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Main/**"
          - "Display/include/**"
    dependencies:
      - package: TerasProtocol
        product: TerasProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teras.mac.core
        PRODUCT_NAME: TerasCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@loader_path/Frameworks"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  Teras:
    type: application
    platform: macOS
    sources:
      - path: Sources/Main
      # Everything in Resources is copied into the bundle, including the
      # Android control server (teras-control.jar) once it is built. Run
      # `xcodegen generate` again after dropping a new file in here.
      - path: Resources
        excludes: ["**/.DS_Store"]
    dependencies:
      - target: TerasCore
        embed: true
        codeSign: true
      - package: TerasProtocol
        product: TerasProtocol
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Teras
        CFBundleDisplayName: Teras
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: "Copyright © 2026 Teras. All rights reserved."
        CFBundleLocalizations: [en, ko]
        CFBundleDevelopmentRegion: en
        NSLocalNetworkUsageDescription: "Teras finds your iPhone, iPad and Android devices on this Wi-Fi network so they can be used as extra displays."
        NSBonjourServices: ["_teras._tcp"]
        NSAccessibilityUsageDescription: "Teras needs Accessibility access to turn taps, scrolls and key presses on your device into mouse and keyboard input on this Mac."
        NSCameraUsageDescription: "Teras does not use the camera."
        NSMicrophoneUsageDescription: "Teras does not use the microphone."
        TerasScreenRecordingUsageDescription: "Teras records the contents of the virtual display it creates so it can send the picture to your device. It never records your other screens."
    entitlements:
      path: Support/Teras.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-dyld-environment-variables: true
        com.apple.security.device.usb: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teras.mac
        PRODUCT_NAME: Teras
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"

  TerasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TerasCore
      - package: TerasProtocol
        product: TerasProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teras.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"

schemes:
  Teras:
    build:
      targets:
        TerasCore: all
        Teras: all
        TerasTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TerasTests
    archive:
      config: Release
