name: Tandem
options:
  bundleIdPrefix: app.tandem
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: RP5GZ99V95
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ENABLE_MODULES: YES
    # Simulator builds must work without a signing identity.
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: ""

packages:
  TandemProtocol:
    path: ../../Shared/TandemProtocol

targets:
  TandemReceiver:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: TandemProtocol
        product: TandemProtocol
    settings:
      base:
        PRODUCT_NAME: TandemReceiver
        PRODUCT_BUNDLE_IDENTIFIER: app.tandem.receiver.ios
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  TandemReceiverTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: TandemReceiver
      - package: TandemProtocol
        product: TandemProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tandem.receiver.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TandemReceiver.app/TandemReceiver"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TandemReceiver:
    build:
      targets:
        TandemReceiver: all
        TandemReceiverTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TandemReceiverTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
